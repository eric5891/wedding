<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>R.S.V.P. — Polina & Eric</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=Cormorant+SC:wght@300;400;500;600&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>

  <nav class="site-nav">
    <a href="index.html" class="nav-link">Home</a>
    <a href="agenda.html" class="nav-link">Agenda</a>
    <a href="our-story.html" class="nav-link">Our Story</a>
    <a href="travel.html" class="nav-link">Travel</a>
    <a href="registry.html" class="nav-link">Registry</a>
    <a href="rsvp.html" class="nav-link active">R.S.V.P.</a>
    <a href="faqs.html" class="nav-link">FAQs</a>
  </nav>

  <main class="page">
    <div class="page-content">
      <div class="content-card card-corners-bottom">

        <h2 class="script-heading">R.S.V.P.</h2>
        <p class="italic-note" style="margin-bottom: 24px;">Kindly respond by July 1st, 2026</p>

        <form id="rsvp-form" class="rsvp-form">
          <div class="form-group">
            <label for="guest-name">Full Name</label>
            <input type="text" id="guest-name" name="name" required placeholder="Your full name">
          </div>
          <div class="form-group">
            <label for="guest-email">Email Address</label>
            <input type="email" id="guest-email" name="email" required placeholder="your@email.com">
          </div>
          <div class="form-group">
            <label for="attendance">Will You Attend?</label>
            <select id="attendance" name="attendance" required>
              <option value="" disabled selected>Please select</option>
              <option value="yes">Joyfully Accepts</option>
              <option value="no">Regretfully Declines</option>
            </select>
          </div>
          <div class="form-group" id="guest-count-group">
            <label for="guest-count">Number of Guests</label>
            <select id="guest-count" name="guests">
              <option value="1">1</option>
              <option value="2">2</option>
              <option value="3">3</option>
              <option value="4">4</option>
            </select>
          </div>
          <div class="form-group" id="dietary-group">
            <label for="dietary">Dietary Restrictions</label>
            <input type="text" id="dietary" name="dietary" placeholder="Any allergies or dietary needs">
          </div>
          <div class="form-group">
            <label for="message">Message for the Couple</label>
            <textarea id="message" name="message" rows="4" placeholder="Share your well wishes..."></textarea>
          </div>
          <button type="submit" class="btn btn-full">Send R.S.V.P.</button>
        </form>

        <div id="rsvp-success" class="rsvp-success hidden">
          <h3 class="script-heading">Grazie!</h3>
          <p>Your R.S.V.P. has been received.<br>We can't wait to celebrate with you in Ravello!</p>
        </div>
      </div>
    </div>

    <footer class="site-footer">
      <p class="footer-names">Polina & Eric</p>
      <p class="footer-detail">August 8, 2026 &middot; Villa Cimbrone, Ravello</p>
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
